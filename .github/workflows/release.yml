name: Release

on:
  push:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (optional)
        if: false # disable if not using GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=${{ github.repository }}:${{ github.ref_name }}
          docker build -t $IMAGE_NAME .

      - name: Save image to tarball
        run: |
          IMAGE_NAME=${{ github.repository }}:${{ github.ref_name }}
          docker save $IMAGE_NAME -o image.tar

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Automated release for tag ${{ github.ref_name }}. Includes Docker image tarball.

      - name: Upload Docker image asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: image.tar
          asset_name: image-${{ github.ref_name }}.tar
          asset_content_type: application/x-tar
